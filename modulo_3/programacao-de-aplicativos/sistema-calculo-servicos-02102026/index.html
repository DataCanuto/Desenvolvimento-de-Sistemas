<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sistema de calculo de servicos</title>
</head>

<body>

    <main>
        <section id="calculadora-servicos">
            <div class="calculadora-container">
                <h2>Calculadora de Serviços</h2>

                <form id="form-servicos" class="form">
                    <label for="servico">Serviço</label>
                    <select id="servico">
                        <option value="1">Formatação de computador</option>
                        <option value="2">Instalação de software</option>
                        <option value="3">Limpeza de computador</option>
                        <option value="4">Manutenção</option>
                        <option value="5">Desconto especial</option>
                    </select>

                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" name="quantidade" step="1" required>

                    <button type="submit" id='btn-calcular' class="btn-calcular">Calcular</button>

                    <label for="valor-unitario">Valor Unitário:</label>
                    <input type="text" id="valor-unitario" name="resultado" readonly>



                    <label for="resultado-servicos">Valor total:</label>
                    <input type="text" id="resultado-servicos" name="resultado" readonly>

                    <button type="submit" id='btn-calcular-desconto' class="btn-calcular">Calcular Desconto</button>

                    <label for="resultado-desconto-servicos">Resultado -10%:</label>
                    <input type="text" id="resultado-desconto-servicos" name="resultado" readonly>

                </form>
            </div>
        </section>

        <section>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Serviço</th>
                        <th>Cálculo</th>
                    </tr>
                </thead>

                <tbody>
                    <table id="tabela-servicos">
                        <tr>
                            <td>1</td>
                            <td>Formatação de computador</td>
                            <td>R$ 120,00</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Instalação de software</td>
                            <td>Quantidade x R$40,00</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>Limpeza de computador</td>
                            <td>Quantidade x R$80,00</td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>Manutenção</td>
                            <td>Horas x R$60,00</td>
                        </tr>
                        <tr>
                            <td>5</td>
                            <td>Desconto especial</td>
                            <td>Subotal - 10%</td>
                        </tr>
                </tbody>
            </table>
        </section>


    </main>

    <script src="app.js"></script>

</body>

</html>
