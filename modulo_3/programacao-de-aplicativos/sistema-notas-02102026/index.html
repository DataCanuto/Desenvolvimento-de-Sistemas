<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
</head>

<body>

    <header>
        <h1>Sistema de Resultado do Aluno</h1>
        <p>Informe os dados do aluno para verificar se foi aprovado ou reprovado</p>
    </header>

    <main>
        <section>

            <div>
                <form id="resultado-aluno-form">
                    <label>Nome do Aluno</label>
                    <input type="text" id="nome-aluno" name="nome-aluno" placeholder="Ex: Maria Silva">

                    <label>Nota(0 a 10)</label>
                    <input type="number" id="nota-aluno" name="nota-aluno" placeholder="Ex: 8.5" step="0.01">

                    <button type="submit" id="btn-calcular-resultado" class="btn-action">Verificar Resultado</button>

                    <h3>Resultado:</h3>
                    
                    <p id="resultado-final"></p>

                    
                </form>
            </div>
        </section>
    </main>

    <footer>
        <h3>Regra de aprovação</h3>
        <ul>
            <li>Média mínima para aprovação: 7,0</li>
        </ul>
    </footer>

    <script src="app.js"></script>

</body>

</html>
